# Runs every test on each pull request and on main, so that a change that breaks something is seen
# before it reaches Home Assistant.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-assistant:
    name: Integration in Home Assistant 2026.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install Home Assistant and its test package
        run: python -m pip install "homeassistant==2026.11.2" "pytest-homeassistant==2026.11.2"
      - name: Run the tests
        run: python -m pytest tests -q -p no:cacheprovider

  protocol:
    name: Protocol layer and measurement tool, without Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install the two packages they need
        run: python -m pip install pytest "cryptography>=42"
      - name: Protocol layer
        run: python -m pytest -q -p no:cacheprovider tests/airlink
      - name: Measurement tool
        working-directory: tools/probe
        run: python -m pytest -q -p no:cacheprovider tests
